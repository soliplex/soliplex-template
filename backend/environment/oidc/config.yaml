#
# OIDC Auth Systems
#
# With no 'auth_systems', the backend runs without authentication. Add and
# remove providers with the skill's 'scripts/oidc_providers.py': it keeps
# nginx's '/ingester/' sign-in in step, and the backend picks the change up
# on its own ('--reload=config').
#
oidc_client_pem_path: "./cacert.pem"

auth_systems: []
