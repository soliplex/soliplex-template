# haiku.rag configuration for Docker deployment
# See https://ggozad.github.io/haiku.rag/configuration/ for details

environment: production

storage:
  data_dir: /data

# Continuous ingestion (haiku-ingester service). One filesystem source
# pointed at the bind-mounted /docs; the job queue lives in its own
# Postgres database (soliplex_ingester) so it survives container restarts
# and shares the stack's Postgres instance. (The LanceDB vector store still
# lives on the /data bind mount; only the queue moved off SQLite.)
#
# The two environment references below are expanded by haiku.rag's own
# loader (0.57+), which interpolates them when it reads this file (an
# earlier release had no interpolation, hence the sed wrapper this
# replaced). INGESTER_TOKEN comes from the container
# environment; INGESTER_DB_PASSWORD is exported from the
# ingester_db_password Docker secret by the 'haiku-ingester' command in
# docker-compose.yml, because interpolation reads the environment, not files.
# An unset or empty value is an error, so a missing token fails at startup
# instead of quietly serving an unauthenticated control plane.
ingester:
  queue:
    # SQLAlchemy async URL; overrides the default SQLite path. asyncpg ships
    # in the slim image's 'ingester' extra.
    dburi: postgresql+asyncpg://soliplex_ingester:${INGESTER_DB_PASSWORD}@postgres/soliplex_ingester
  api:
    host: 0.0.0.0
    auth_token: ${INGESTER_TOKEN}
  sources:
    - type: fs
      id: local-docs
      root: /docs
      # Gitignore-style filters over 'root'; empty lists ingest everything.
      # An 'include_patterns' entry makes the filter exclusive, so leave it
      # empty unless the corpus really is one file type.
      ignore_patterns: []   # e.g. ["*.png"]
      include_patterns: []  # e.g. ["*.md"]
      delete_orphans: true

# Remote document processing with docling-serve
processing:
  converter: docling-serve
  chunker: docling-serve
  chunk_size: 256
  chunker_type: hybrid
  chunking_tokenizer: "Qwen/Qwen3-Embedding-0.6B"
  chunking_merge_peers: true
  chunking_use_markdown_tables: false

providers:
  docling_serve:
    base_url: http://docling-serve:5001
    api_key: ""

# Use environment: OLLAMA_BASE_URL
# ollama:
#   base_url: http://host.docker.internal:11434


# For other providers (OpenAI, Anthropic, VoyageAI, etc.),
# see: https://ggozad.github.io/haiku.rag/configuration/
