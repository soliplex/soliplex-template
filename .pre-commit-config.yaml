repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version matching your devenv setup
    rev: v0.16.6
    hooks:
      - id: ruff-check
        types: [python]
      - id: ruff-format
        types: [python]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0 # Use the latest stable version
    hooks:
      - id: no-commit-to-branch
        args: ["--branch", "main", "--branch", "master"]
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: pip-audit
        name: pip-audit
        entry: uv run --with pip-audit pip-audit --skip-editable
        language: system
        pass_filenames: false
        files: (^pyproject\.toml$|^uv\.lock|^.pre-commit-config.yaml$)
      - id: agentskills-validate
        name: agentskills validate
        entry: uv run --group dev agentskills validate skills/soliplex-template
        language: system
        pass_filenames: false
        files: ^skills/soliplex-template/
      - id: lint-version-pairings
        name: lint version pairings vs generator defaults
        entry: uv run python scripts/lint_version_pairings.py --verbose
        language: system
        pass_filenames: false
        # The generator's default pins and the published tables agree.
        files: ^skills/soliplex-template/scripts/generate_soliplex_project\.py$
          |^skills/soliplex-template/references/version_pairings\.toml$
          |^docs/getting-started/includes/haiku-rag-pairings\.md$
      - id: lint-version-pairings-self-test
        name: lint version pairings (self-test)
        entry: uv run python scripts/lint_version_pairings.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/lint_version_pairings\.py$

  - repo: https://github.com/jackdewinter/pymarkdown
    rev: v0.9.36
    hooks:
      - id: pymarkdown
        args:
          - "scan"

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
