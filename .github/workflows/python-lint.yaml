name: Python linting

# Mirrors soliplex/soliplex's python-lint.yaml: enforce `ruff format --check`
# and `ruff check` (same rule config, see pyproject.toml) on the repo's Python.
# The pre-commit `ruff-check`/`ruff-format` hooks gate this locally; this job is

on:
  push:
    branches:
      - main
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/**'
      - 'skills/soliplex-template/**'
      - 'tests/**'
      - 'docs/getting-started/includes/**'
      - '.github/workflows/python-lint.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'scripts/**'
      - 'skills/soliplex-template/**'
      - 'tests/**'
      - 'docs/getting-started/includes/**'
      - '.github/workflows/python-lint.yaml'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Check formatting
        run: |
          set -o pipefail
          uv run ruff format --check 2>&1 | tee ruff-format.log

      - name: Run ruff linter
        run: |
          set -o pipefail
          uv run ruff check 2>&1 | tee ruff-check.log

      # The generator's default version pins and the published pairing
      # tables agree (#229). The self-test runs first, so a check gone
      # blind fails loudly rather than passing by finding nothing.
      - name: Check version pairings vs generator defaults
        run: |
          set -o pipefail
          uv run python scripts/lint_version_pairings.py --self-test 2>&1 \
            | tee lint-version-pairings.log
          uv run python scripts/lint_version_pairings.py --verbose 2>&1 \
            | tee -a lint-version-pairings.log

      # Slack notification lives in 'ci-failure-notify.yaml', which only
      # links to this run (see #162), so record what failed here.
      - name: Summarize failures
        if: failure()
        run: |
          {
            echo "## Linting failed"
            echo
            for log in ruff-format.log ruff-check.log \
                       lint-version-pairings.log; do
              [ -f "$log" ] || continue
              echo "<details><summary>$log</summary>"
              echo
              echo '```'
              tail -n 100 "$log"
              echo '```'
              echo
              echo "</details>"
              echo
            done
          } >> "$GITHUB_STEP_SUMMARY"
